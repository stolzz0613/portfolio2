# Every day: pull the latest Google Health data for "Crónica del Aventurero", ask the Sage (Claude)
# for this week's advice, have Claude write this week's chapter of the chronicle (and any past week
# still missing one) and redeploy andresb.dev to GitHub Pages. master is protected, so the data
# isn't committed there: it lives in the published gh-pages branch and is restored from it first.
#
# Secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN  (required)
#   ANTHROPIC_API_KEY                                             (optional: without it the advice isn't refreshed)
#   ANTHROPIC_WORKSPACE_ID                                        (only for keys not scoped to a workspace)
#   BIRTH_DATE                                                    (optional, YYYY-MM-DD, for the physiological age)
name: Crónica del Aventurero

on:
  schedule:
    - cron: "50 11 * * *" # 06:50 in Colombia (UTC-5)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cronica
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore the published data
        run: node scripts/cronica/restore-data.mjs

      - name: Sync Google Health
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BIRTH_DATE: ${{ secrets.BIRTH_DATE }}
          CRONICA_OUT: static/proyectos/cronica-del-aventurero/data/days.json
        run: node scripts/cronica/sync.mjs

      - name: Ask the Sage
        if: env.HAS_ANTHROPIC_KEY == 'true'
        continue-on-error: true # keep deploying the new data even if Claude fails
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          npx playwright install --with-deps chromium
          node scripts/cronica/sage.mjs

      - name: Write the chronicle
        if: env.HAS_ANTHROPIC_KEY == 'true'
        continue-on-error: true # a failed chapter is retried on the next run; the rest still deploys
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: node scripts/cronica/cronica.mjs

      - name: Build and deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx gatsby build
          # gh-pages takes the commit author from git config (its -u option can't parse the bot's name).
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d public -m "Update Crónica del Aventurero data" \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
